ktor:
    application:
        modules:
            - com.locationapp.ApplicationKt.module
    deployment:
        port: 8080
jwt:
  issuer: "http://0.0.0.0:8080"
  audience: "http://0.0.0.0:8080/audience"
  realm: "locationapp"
  privateKey: ${jwt_pk}
  publicKey: ${jwt_Pk}
postgres:
  url: ${postgres_url}
  user: ${postgres_user}
  password: ${postgres_pass}